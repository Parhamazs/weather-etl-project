version: '3.8'
services:
  db:
    image: postgres:15-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    # سرویس جدید برای اجرای اسکریپت پایتون
  etl_job:
    build: .
    container_name: weather_etl_job
    depends_on:
      - db
    environment:
      DB_HOST: db  # مهم: در داخل داکر، دیتابیس با نام سرویس شناخته می‌شود
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432

volumes:
  postgres_data: